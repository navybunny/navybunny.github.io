<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>页面不存在 — NavyBunny的博客</title>
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/images/favicon.png" type="image/png">
</head>
<body>
<main id="main-content" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
  <div style="text-align:center;max-width:520px;">
    <div style="font-size:96px;font-weight:900;line-height:1;letter-spacing:-4px;color:var(--primary);">404</div>
    <h1 style="margin:16px 0 8px;font-size:24px;">这个页面不存在</h1>
    <p style="margin:0 0 28px;color:var(--text-secondary);line-height:1.8;">
      链接可能写错了，或者这篇文章已经被移动。<br>
      可以去首页看看，或者翻翻归档与标签。
    </p>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">
      <a href="/" style="padding:11px 22px;border-radius:999px;background:var(--primary);color:#061014;font-weight:700;text-decoration:none;">回到首页</a>
      <a href="/archives/" style="padding:11px 22px;border-radius:999px;border:1px solid var(--border);color:var(--text);text-decoration:none;">全部归档</a>
      <a href="/tags/" style="padding:11px 22px;border-radius:999px;border:1px solid var(--border);color:var(--text);text-decoration:none;">标签</a>
    </div>
  </div>
</main>
</body>
</html>
